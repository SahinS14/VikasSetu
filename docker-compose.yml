services:
  postgres:
    image: postgres:16-alpine
    container_name: sahakarsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahakarsetu
      POSTGRES_USER: sahakarsetu
      POSTGRES_PASSWORD: sahakarsetu_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sahakarsetu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahakarsetu -d sahakarsetu"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sahakarsetu_postgres_data:
